[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bracket-validator-lab-ua-2026"
version = "1.0.0"
description = "Validator for balanced (), {} and <> brackets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[tool.setuptools]
py-modules = ["bracket_validator"]
